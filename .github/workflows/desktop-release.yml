# Builds the signed Windows installer and publishes it as a DRAFT GitHub release with the
# update manifest (latest.json). Installed apps see the update only after you review the
# draft and press Publish. Setup and steps: docs/RELEASING.md.
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$TAG" = "desktop-v$version" ] || {
            echo "::error::Tag $TAG doesn't match version $version in tauri.conf.json. Run scripts/bump-desktop-version.sh first."
            exit 1
          }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Updater settings
        env:
          PUBKEY: ${{ vars.NEXUS_UPDATER_PUBKEY }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          [ -n "$PUBKEY" ] && [ "$HAS_KEY" = true ] || {
            echo "::error::Set the NEXUS_UPDATER_PUBKEY variable and TAURI_SIGNING_PRIVATE_KEY secret (docs/RELEASING.md)."
            exit 1
          }
          node -e '
            const fs = require("fs");
            fs.writeFileSync("src-tauri/tauri.release.conf.json", JSON.stringify({
              bundle: { createUpdaterArtifacts: true },
              plugins: { updater: {
                pubkey: process.env.PUBKEY,
                endpoints: [`https://github.com/${process.env.GITHUB_REPOSITORY}/releases/latest/download/latest.json`],
                requireSignedVersion: true,
                windows: { installMode: "passive" },
              } },
            }, null, 2));
          '

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and sign the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2.12.6 build --config src-tauri/tauri.release.conf.json

      - name: Write the update manifest
        run: |
          dir=src-tauri/target/release/bundle/nsis
          exe=$(ls "$dir"/*-setup.exe | head -n1)
          name=$(basename "$exe")
          # The updater rejects signatures that don't name the version they were signed for.
          base64 -d "$exe.sig" | grep -q "version:$VERSION" || {
            echo "::error::The signature doesn't record version $VERSION; update the Tauri CLI."
            exit 1
          }
          SIG=$(cat "$exe.sig") URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name" \
          node -e '
            require("fs").writeFileSync(process.argv[1], JSON.stringify({
              version: process.env.VERSION,
              notes: `NEXUS ${process.env.VERSION}`,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature: process.env.SIG, url: process.env.URL } },
            }, null, 2));
          ' "$dir/latest.json"
          echo "INSTALLER=$exe" >> "$GITHUB_ENV"

      - name: Create the draft release
        run: |
          gh release create "$TAG" --draft --verify-tag \
            --title "NEXUS $VERSION for Windows" \
            --notes "Review, then Publish. Installed apps offer the update once this is published." \
            "$INSTALLER" "$INSTALLER.sig" "$(dirname "$INSTALLER")/latest.json"
