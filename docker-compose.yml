# Local development stack. Copy .env.example to .env first.
name: nexus

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: nexus
    # Only this PC can reach the database, Redis and MinIO; the app reaches them inside Docker.
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      retries: 10

    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexus-dev-password}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]

  # Local AI. On Windows with an AMD GPU, run Ollama or LM Studio natively instead (Docker
  # can't use the GPU there); the API reaches it through host.docker.internal.
  # On Linux with a supported GPU you can use this container: docker compose --profile ai up
  ollama:
    image: ollama/ollama:0.5.4
    profiles: ["ai"]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

  api:
    build: ./services/api
    env_file: .env
    environment:
      NEXUS_DATABASE_URL: postgresql+asyncpg://nexus:${POSTGRES_PASSWORD:-nexus}@postgres:5432/nexus
      NEXUS_REDIS_URL: redis://redis:6379/0
      # The model server runs on the host (Ollama :11434 or LM Studio :1234).
      NEXUS_LOCAL_BASE_URL: ${NEXUS_LOCAL_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
      NEXUS_OLLAMA_URL: ${NEXUS_OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
      NEXUS_STORAGE_DIR: /app/data/uploads
      # Voice runs in the "voice" service unless you point these at whisper.cpp on your PC.
      NEXUS_STT_URL: ${NEXUS_STT_URL_DOCKER:-http://voice:8880/v1/audio/transcriptions}
      NEXUS_TTS_URL: ${NEXUS_TTS_URL_DOCKER:-http://voice:8880/v1/audio/speech}
      NEXUS_SEARXNG_URL: ${NEXUS_SEARXNG_URL_DOCKER:-http://search:8080}
      NEXUS_BACKUP_DIR: /app/backups
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [uploads:/app/data, "./backups:/app/backups:ro"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

    restart: unless-stopped
  worker:
    build: ./services/api
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment:
      NEXUS_DATABASE_URL: postgresql+asyncpg://nexus:${POSTGRES_PASSWORD:-nexus}@postgres:5432/nexus
      NEXUS_REDIS_URL: redis://redis:6379/0
      # The model server runs on the host (Ollama :11434 or LM Studio :1234).
      NEXUS_LOCAL_BASE_URL: ${NEXUS_LOCAL_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
      NEXUS_OLLAMA_URL: ${NEXUS_OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
      NEXUS_STORAGE_DIR: /app/data/uploads
      # Voice runs in the "voice" service unless you point these at whisper.cpp on your PC.
      NEXUS_STT_URL: ${NEXUS_STT_URL_DOCKER:-http://voice:8880/v1/audio/transcriptions}
      NEXUS_TTS_URL: ${NEXUS_TTS_URL_DOCKER:-http://voice:8880/v1/audio/speech}
      NEXUS_SEARXNG_URL: ${NEXUS_SEARXNG_URL_DOCKER:-http://search:8080}
      NEXUS_BACKUP_DIR: /app/backups
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [uploads:/app/data, "./backups:/app/backups:ro"]
    depends_on:
      api: { condition: service_started }

  # Nightly backups of the database and uploads into ./backups on your PC (copy that folder
  # to another drive or cloud folder too). The encryption key is not in them: keep your
  # .env somewhere safe and separate. Restore drill: scripts/restore-drill.sh
    restart: unless-stopped
  backup:
    image: pgvector/pgvector:pg16
    entrypoint: ["/scripts/schedule.sh"]
    environment:
      PGHOST: postgres
      PGUSER: nexus
      PGPASSWORD: ${POSTGRES_PASSWORD:-nexus}
      PGDATABASE: nexus
      BACKUP_DIR: /backups
      UPLOADS_DIR: /uploads
      BACKUP_TIME: ${NEXUS_BACKUP_TIME:-03:00}
      BACKUP_KEEP: ${NEXUS_BACKUP_KEEP:-14}
      TZ: ${NEXUS_BACKUP_TZ:-UTC}
    volumes:
      - ./infra/backup:/scripts:ro
      - ./backups:/backups
      - uploads:/uploads
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # Local speech-to-text (Whisper) and voice (Piper). Models download on first use into
  # the "voices" volume. Not published on a host port: only the API talks to it.
  voice:
    build: ./services/voice
    environment:
      VOICE_STT_MODEL: ${NEXUS_VOICE_STT_MODEL:-base.en}
      VOICE_TTS_VOICE: ${NEXUS_TTS_VOICE:-en_US-lessac-medium}
      VOICE_PRELOAD: "1"
    volumes: [voices:/data]
    restart: unless-stopped

  # Private web search (SearXNG) for research. Free, no API key. Reachable on
  # http://localhost:8888 for checking it by hand. SearXNG publishes date tags only;
  # pin one from hub.docker.com/r/searxng/searxng/tags if you want fixed upgrades.
  search:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me}
    volumes: ["./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro"]
    ports: ["127.0.0.1:8888:8080"]
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args: { NEXUS_API_URL: "http://api:8000" }
    environment:
      NEXUS_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

    restart: unless-stopped
volumes:
  voices:
  uploads:
  pgdata:
  miniodata:
  ollama:
