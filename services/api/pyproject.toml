[project]
name = "nexus-api"
version = "0.1.0"
description = "NEXUS AI backend API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "pyotp>=2.9",
  "cryptography>=43",
  "redis>=5.2",
  "structlog>=24.4",
  "arq>=0.28.0",
  "anthropic>=2.12.0",
  "httpx>=0.28.1",
  "python-dateutil>=4.0.0",
  "pgvector>=0.5.1",
  "python-multipart>=0.0.34",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-python-dateutil>=2.9.0.20261116",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
"alembic/**" = ["E402", "E501"]
# prompt text reads better unwrapped
"app/ai/memory_agent.py" = ["E501"]
"app/ai/task_parser.py" = ["E501"]
"app/ai/orchestrator.py" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
