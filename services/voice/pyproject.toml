[project]
name = "nexus-voice"
version = "0.1.0"
description = "Local speech-to-text (faster-whisper) and text-to-speech (Piper) server for NEXUS"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# The engines are optional so tests and CI don't download model runtimes.
engines = ["faster-whisper>=1.1", "piper-tts>=1.3"]

[project.scripts]
nexus-voice = "nexus_voice.server:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_voice"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"nexus_voice/server.py" = ["S104"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["faster_whisper", "piper", "piper.*"]
ignore_missing_imports = true
