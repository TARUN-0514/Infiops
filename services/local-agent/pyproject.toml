[project]
name = "nexus-agent"
version = "0.1.0"
description = "NEXUS local agent for Windows: wake word, hands-free voice and the link to your NEXUS server"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "websockets>=13",
]

[project.optional-dependencies]
# Microphone, speaker and wake word. Optional so tests run without audio hardware.
audio = ["sounddevice>=0.5", "numpy>=1.26", "openwakeword>=0.6"]

[project.scripts]
nexus-agent = "nexus_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["sounddevice", "openwakeword", "openwakeword.*", "numpy"]
ignore_missing_imports = true
